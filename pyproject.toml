[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-shopping-behavior-analytics"
version = "1.0.0"
description = "End-to-end customer shopping behavior analytics pipeline with Python, PostgreSQL, SQL, and Power BI."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.2,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "jupyter>=1.0,<2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
